<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Discover</title>

  <!-- PWA用の設定読み込み -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2d2e30">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ニュース">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    // Service Workerの登録
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('PWA Ready!'))
        .catch((err) => console.log('PWA error:', err));
    }
  </script>

  <style>
    /* ===== 色の定義（ダーク / ライト） ===== */
    :root {
      --bg: #1b1c1e; --card: #1b1c1e; --card-2: #2d2e31; --border: #3c4043; --line: #2c2d30; --fav-bg: #28324a;
      --text: #e8eaed; --muted: #9aa0a6; --accent: #8ab4f8; --on-accent: #202124;
      --amber: #fdd663; --amber-bg: rgba(253, 214, 99, .12);
      --danger: #f28b82; --ok: #81c995;
      --toast-bg: #e8eaed; --toast-text: #202124; --toast-action: #1a73e8;
      --skel: #3a3b3e; --skel-hi: #4a4c50;
      --shadow: 0 8px 28px rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #ffffff; --card: #ffffff; --card-2: #f1f3f4; --border: #e8eaed; --line: #f1f3f4; --fav-bg: #e8f0fe;
      --text: #202124; --muted: #5f6368; --accent: #1a73e8; --on-accent: #ffffff;
      --amber: #b06000; --amber-bg: rgba(251, 188, 4, .16);
      --danger: #d93025; --ok: #188038;
      --toast-bg: #303134; --toast-text: #e8eaed; --toast-action: #8ab4f8;
      --skel: #e8eaed; --skel-hi: #f6f7f8;
      --shadow: 0 8px 28px rgba(60, 64, 67, .22);
      color-scheme: light;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Segoe UI", sans-serif; }
    body { min-height: 100vh; overscroll-behavior-y: none; }
    body.lock { overflow: hidden; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    [hidden] { display: none !important; }

    .icon { width: 20px; height: 20px; flex: none; }
    .icon.sm { width: 16px; height: 16px; }
    .icon.lg { width: 44px; height: 44px; }
    .icon.fill { fill: currentColor; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin .8s linear infinite; }

    /* ===== ヘッダー ===== */
    .app-header {
      position: sticky; top: 0; z-index: 20;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) 0 0;
      background: var(--card);
      background: color-mix(in srgb, var(--card) 90%, transparent);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .hbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 8px 2px 16px; }
    .brand { min-width: 0; }
    .brand h1 em { font-style: normal; color: var(--accent); }
    .brand-icon { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
      color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
    .brand h1 { font-size: 19px; font-weight: 800; margin: 0; line-height: 1.2; letter-spacing: -.01em; }
    .brand p { font-size: 11px; color: var(--muted); margin: 2px 0 0; }
    .actions { display: flex; align-items: center; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; position: relative; }
    .icon-btn:active { background: var(--card-2); }
    @media (hover: hover) { .icon-btn:hover { background: var(--card-2); } }
    .badge { position: absolute; top: 3px; right: 2px; min-width: 17px; height: 17px; padding: 0 4px;
      border-radius: 9px; background: var(--accent); color: var(--on-accent);
      font-size: 10px; font-weight: 700; display: grid; place-items: center; }

    /* ===== メイン & プルトゥリフレッシュ ===== */
    main { position: relative; max-width: 640px; margin: 0 auto;
      padding: 12px 0 calc(96px + env(safe-area-inset-bottom));
      transform: translateY(var(--pull, 0px)); }
    main.release { transition: transform .3s ease; }
    .ptr { position: absolute; top: -48px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
      border-radius: 18px; background: var(--card); box-shadow: var(--shadow);
      font-size: 12px; color: var(--muted); white-space: nowrap; opacity: var(--ptr-o, 0); }
    .ptr .icon { transform: rotate(var(--ptr-rot, 0deg)); transition: transform .2s; }
    .ptr.loading .icon { animation: spin .8s linear infinite; }

    /* ===== 検索 & オートコンプリート ===== */
    #quick-field { margin: 0 16px 4px; height: 42px; background: var(--card-2); border-color: transparent; }
    .field { position: relative; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px 0 14px;
      background: var(--card); border: 1px solid var(--border); border-radius: 23px; color: var(--muted); }
    .field:focus-within { border-color: var(--accent); }
    .field input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
      color: var(--text); font-size: 16px; /* 16px未満だとiPhoneで勝手にズームされる */ }
    .field input::placeholder { color: var(--muted); }
    .ac-list { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 15;
      list-style: none; margin: 0; padding: 6px; background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow);
      max-height: 300px; overflow-y: auto; }
    .ac-item { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 10px; font-size: 14px; cursor: pointer; }
    .ac-item.active { background: var(--card-2); }
    .ac-item mark { background: none; color: var(--accent); font-weight: 700; }
    .ac-item .tag { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
    .ac-item .icon { color: var(--muted); }

    /* ===== チップ ===== */
    .chips { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; padding: 0 16px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { white-space: nowrap; font-size: 14px; padding: 9px 0 8px; color: var(--muted); border-bottom: 3px solid transparent; }
    .chip.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
    .stat { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .hint { display: flex; align-items: center; gap: 8px; margin: 8px 16px 4px; padding: 8px 6px 8px 12px;
      font-size: 12px; color: var(--muted); border: 1px dashed var(--border); border-radius: 12px; }
    .hint span { flex: 1; }

    /* ===== カード & スワイプ ===== */
    .feed { display: flex; flex-direction: column; gap: 14px; }
    .swipe { position: relative; border-radius: 18px; overflow: hidden; }
    .swipe.collapse { transition: height .25s ease, opacity .25s ease, margin .25s ease; }
    .swipe-bg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between;
      padding: 0 22px; font-size: 13px; font-weight: 700; border-radius: 18px; visibility: hidden; }
    .swipe-bg > div { display: flex; align-items: center; gap: 6px; opacity: .45; transition: opacity .15s, transform .15s; }
    .swipe[data-dir="right"] .swipe-bg { visibility: visible; color: var(--ok); background: color-mix(in srgb, var(--ok) 22%, var(--bg)); }
    .swipe[data-dir="left"] .swipe-bg { visibility: visible; color: var(--danger); background: color-mix(in srgb, var(--danger) 22%, var(--bg)); }
    .swipe[data-dir="right"] .bg-dismiss, .swipe[data-dir="left"] .bg-save { visibility: hidden; }
    .swipe.armed .swipe-bg > div { opacity: 1; transform: scale(1.12); }

    .card { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden;
      touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      transition: transform .25s ease; }
    .card.dragging { transition: none; }
    .rec { display: flex; align-items: center; gap: 6px; padding: 7px 14px; font-size: 11px; font-weight: 600;
      color: var(--amber); background: var(--amber-bg); }
    .thumb { position: relative; display: block; aspect-ratio: 16 / 9; overflow: hidden; background: linear-gradient(135deg, var(--card-2), var(--border)); -webkit-touch-callout: none; }
    .thumb .ph { display: none; position: absolute; inset: 0; place-items: center; font-size: 48px; font-weight: 700; color: var(--muted); opacity: .5; }
    .thumb.noimg { aspect-ratio: 16 / 6; }
    .thumb.noimg .ph { display: grid; }
    .card a { color: inherit; text-decoration: none; -webkit-touch-callout: none; }
    .users { font-size: 11px; font-weight: 600; color: var(--danger); margin-left: 4px; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none; }
    .thumb .cat { position: absolute; top: 10px; left: 10px; font-size: 11px; color: #fff;
      background: rgba(0, 0, 0, .55); padding: 3px 10px; border-radius: 12px; }
    .card-body { padding: 12px 14px 4px; }
    .meta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .meta .src { display: flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .card h2 { font-size: 16px; line-height: 1.45; margin: 0 0 8px; }
    .bar { display: flex; align-items: center; margin: 0 -8px; border-top: 1px solid var(--border); }
    .bar .icon-btn { color: var(--muted); }
    .bar .liked { color: var(--danger); }
    .bar .saved { color: var(--accent); }
    .spacer { flex: 1; }

    /* ===== B案：リスト表示 ===== */
    .feed { gap: 0; }
    .swipe { border-radius: 0; border-bottom: 1px solid var(--line); }
    .swipe-bg { border-radius: 0; }
    .card { border: 0; border-radius: 0; background: var(--bg); }
    .card .src { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; }
    .fav { width: 16px; height: 16px; flex: none; border-radius: 4px; background: var(--fav-bg); color: var(--accent);
      font-size: 10px; font-weight: 800; display: grid; place-items: center; }
    .card .sub { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
    .card .sub > span:first-child { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .card .sub .rec-l { color: var(--amber); font-weight: 700; }
    .card .sub .liked-i { color: var(--danger); }
    .card .sub .saved-i { color: var(--accent); }
    .card .more { width: 32px; height: 28px; display: grid; place-items: center; color: var(--muted); margin-right: -8px; border-radius: 8px; }
    .card .more:active { background: var(--card-2); }
    .fav.yt { background: #ff0033; color: #fff; font-size: 8px; }
    .thumb .play { position: absolute; right: 6px; bottom: 6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(0, 0, 0, .65); color: #fff; font-size: 11px; padding-left: 2px; }
    .card.hero .thumb .play { width: 44px; height: 44px; font-size: 18px; right: 12px; bottom: 12px; }
    .card.hero { padding: 14px 16px 10px; }
    .card.hero .thumb { border-radius: 16px; margin-bottom: 10px; }
    .card.hero h2 { font-size: 18px; line-height: 1.45; margin: 4px 0 6px; }
    .card.row { display: flex; gap: 12px; padding: 14px 16px 10px; }
    .card.row .txt { flex: 1; min-width: 0; }
    .card.row h3 { font-size: 14.5px; line-height: 1.5; margin: 4px 0 4px; font-weight: 700;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card.row .thumb, .card.row .thumb.noimg { width: 84px; height: 84px; aspect-ratio: auto; flex: none; border-radius: 12px; margin-top: 2px; }
    .card.row .thumb .ph { font-size: 26px; }
    .skel.list { display: flex; gap: 12px; padding: 16px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: var(--bg); }
    .skel.list .grow { flex: 1; }
    .skel.list .sk.line { margin: 0 0 10px; }
    .skel.list .sk.box { width: 84px; height: 84px; border-radius: 12px; flex: none; }
    .skel.hero { border: 0; border-radius: 0; background: var(--bg); padding: 14px 16px 16px; border-bottom: 1px solid var(--line); }
    .skel.hero .sk.img { border-radius: 16px; }
    .skel.hero .sk.line { margin: 12px 0 0; }

    /* ===== スケルトン ===== */
    .skel { background: var(--card); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; padding-bottom: 12px; }
    .sk { border-radius: 6px; background: linear-gradient(90deg, var(--skel) 25%, var(--skel-hi) 37%, var(--skel) 63%);
      background-size: 400% 100%; animation: shimmer 1.3s ease infinite; }
    .sk.img { aspect-ratio: 16 / 9; border-radius: 0; }
    .sk.line { height: 12px; margin: 12px 14px 0; }
    @keyframes shimmer { from { background-position: 100% 50%; } to { background-position: 0 50%; } }

    .empty { text-align: center; padding: 56px 16px; color: var(--muted); }
    .empty h3 { color: var(--text); font-size: 15px; margin: 12px 0 6px; }
    .empty p { font-size: 12px; margin: 0 0 16px; }

    /* ===== ボタン共通 ===== */
    .btn { height: 40px; padding: 0 18px; border-radius: 20px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 600; }
    .btn.ghost { background: var(--card-2); color: var(--text); }

    /* ===== ボトムシート ===== */
    .backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .5); opacity: 0; pointer-events: none; transition: opacity .25s; }
    .backdrop.show { opacity: 1; pointer-events: auto; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 560px; margin: 0 auto; max-height: 86vh;
      display: flex; flex-direction: column; background: var(--card); border-radius: 20px 20px 0 0; box-shadow: var(--shadow);
      padding-bottom: env(safe-area-inset-bottom);
      transform: translateY(105%); visibility: hidden;
      transition: transform .32s cubic-bezier(.2, .8, .2, 1), visibility 0s .32s; }
    .sheet.open { transform: translateY(0); visibility: visible; transition: transform .32s cubic-bezier(.2, .8, .2, 1), visibility 0s; }
    .sheet.dragging { transition: none; }
    .sheet-head { padding: 8px 12px 6px 18px; touch-action: none; cursor: grab; }
    .grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 0 auto 8px; }
    .sheet-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 16px; font-weight: 700; }
    .sheet-title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 4px 18px 20px; }
    .section { margin-top: 18px; }
    .section:first-child { margin-top: 6px; }
    .section h3 { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
    .panel { background: var(--card-2); border-radius: 14px; padding: 14px; }
    .slider-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .slider-val { font-size: 12px; color: var(--amber); background: var(--amber-bg); padding: 2px 8px; border-radius: 6px; }
    input[type="range"] { width: 100%; accent-color: var(--amber); }
    .slider-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .tag-pill { display: inline-flex; align-items: center; gap: 2px; padding: 4px 4px 4px 12px; border-radius: 16px; font-size: 13px;
      color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
    .tag-pill button { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
    .preset { padding: 6px 12px; border-radius: 14px; border: 1px solid var(--border); font-size: 12px; }
    .preset:disabled { opacity: .4; cursor: default; }
    .action-list button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 6px; font-size: 15px; border-radius: 12px; text-align: left; }
    .action-list button:active { background: var(--card-2); }
    .action-list .danger { color: var(--danger); }
    .saved-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .saved-item a { flex: 1; min-width: 0; color: var(--text); text-decoration: none; line-height: 1.4; }
    .saved-item small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .muted { color: var(--muted); font-size: 12px; }

    /* ===== トースト ===== */
    .toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 60;
      max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 12px 10px 12px 16px;
      border-radius: 14px; background: var(--toast-bg); color: var(--toast-text); box-shadow: var(--shadow); font-size: 13px;
      transform: translateY(150%); opacity: 0; pointer-events: none; transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .3s; }
    .toast.show { transform: none; opacity: 1; pointer-events: auto; }
    .toast span { flex: 1; }
    .toast button { color: var(--toast-action); font-weight: 700; padding: 6px 8px; white-space: nowrap; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header class="app-header">
   <div class="hbar">
    <div class="brand">
      <h1>My <em>Discover</em></h1>
      <p id="updated">記事を読み込み中…</p>
    </div>
    <div class="actions">
      <button id="refresh-btn" class="icon-btn" aria-label="フィードを更新"><i data-icon="refresh"></i></button>
      <button id="saved-btn" class="icon-btn" aria-label="保存した記事"><i data-icon="bookmark"></i><span id="saved-badge" class="badge" hidden>0</span></button>
      <button id="theme-btn" class="icon-btn" aria-label="テーマ切り替え"><i data-icon="sun" id="theme-icon"></i></button>
      <button id="settings-btn" class="icon-btn" aria-label="チューニング"><i data-icon="sliders"></i></button>
    </div>
   </div>
    <nav class="chips" id="chips" aria-label="話題で絞り込み"></nav>
    <span id="feed-stat" hidden></span>
  </header>

  <main id="main">
    <!-- プルトゥリフレッシュの表示 -->
    <div id="ptr" class="ptr"><i data-icon="arrowDown"></i><span id="ptr-text">引っぱって更新</span></div>

    <!-- 検索（オートコンプリート付き） -->
    <div class="field" id="quick-field">
      <i data-icon="search"></i>
      <input type="text" id="quick-input" placeholder="興味のある話題をフォロー（例: キャンプ）" autocomplete="off" enterkeyhint="done" aria-autocomplete="list" aria-controls="quick-ac">
      <ul class="ac-list" id="quick-ac" role="listbox" hidden></ul>
    </div>

    <!-- 操作ヒント（初回のみ） -->
    <div class="hint" id="hint" hidden>
      <i data-icon="sparkles" class="sm"></i>
      <span>記事を ← で「興味なし」、→ で「保存」。長押しか「…」でメニュー</span>
      <button class="icon-btn" id="hint-close" aria-label="ヒントを閉じる"><i data-icon="x" class="sm"></i></button>
    </div>

    <div id="feed" class="feed"></div>

    <div id="empty" class="empty" hidden>
      <i data-icon="inbox" class="lg"></i>
      <h3>表示できる記事がありません</h3>
      <p>話題をフォローするか、チューニングで「意外な記事の割合」を上げてみてください。</p>
      <button class="btn" id="empty-settings">チューニングを開く</button>
    </div>
  </main>

  <!-- ボトムシート共通の背景 -->
  <div id="backdrop" class="backdrop"></div>

  <!-- ボトムシート：チューニング -->
  <section class="sheet" id="sheet-settings" role="dialog" aria-modal="true" aria-label="チューニング">
    <div class="sheet-head">
      <div class="grabber"></div>
      <div class="sheet-title"><span>チューニング</span><button class="icon-btn" data-close aria-label="閉じる"><i data-icon="x"></i></button></div>
    </div>
    <div class="sheet-body">
      <div class="section">
        <div class="panel">
          <div class="slider-head"><span>意外な記事の割合</span><span class="slider-val" id="play-val">50%</span></div>
          <input type="range" id="play-slider" min="0" max="80" step="10" value="20">
          <div class="slider-ends"><span>🎯 本命ニュース</span><span>🎲 意外な発見</span></div>
        </div>
      </div>
      <div class="section">
        <h3><span>フォロー中の話題</span><span id="topic-count"></span></h3>
        <div class="field">
          <i data-icon="plus"></i>
          <input type="text" id="topic-input" placeholder="話題を追加…" autocomplete="off" enterkeyhint="done">
          <ul class="ac-list" id="topic-ac" role="listbox" hidden></ul>
        </div>
        <div class="tags" id="topic-tags"></div>
      </div>
      <div class="section">
        <h3><span>自動収集している話題</span></h3>
        <p class="muted" style="margin:0 0 8px">ここにない話題をフォローすると、集めた記事のうちタイトルに含むものを表示します。</p>
        <div class="tags" id="presets"></div>
      </div>
      <div class="section">
        <button class="btn ghost" id="reset-btn">学習内容と設定を初期化</button>
      </div>
    </div>
  </section>

  <!-- ボトムシート：保存した記事 -->
  <section class="sheet" id="sheet-saved" role="dialog" aria-modal="true" aria-label="保存した記事">
    <div class="sheet-head">
      <div class="grabber"></div>
      <div class="sheet-title"><span>あとで読む</span><button class="icon-btn" data-close aria-label="閉じる"><i data-icon="x"></i></button></div>
    </div>
    <div class="sheet-body" id="saved-list"></div>
  </section>

  <!-- ボトムシート：記事メニュー -->
  <section class="sheet" id="sheet-actions" role="dialog" aria-modal="true" aria-label="記事メニュー">
    <div class="sheet-head">
      <div class="grabber"></div>
      <div class="sheet-title"><span id="actions-title"></span><button class="icon-btn" data-close aria-label="閉じる"><i data-icon="x"></i></button></div>
    </div>
    <div class="sheet-body action-list" id="actions-list"></div>
  </section>

  <!-- トースト -->
  <div id="toast" class="toast" role="status" aria-live="polite">
    <span id="toast-msg"></span>
    <button id="toast-action" hidden></button>
  </div>

  <script>
    /* =========================================================
       アイコン（外部ライブラリを使わず、SVGを直接埋め込み）
       ========================================================= */
    const ICONS = {
      compass: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
      bookmark: '<path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
      sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
      moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
      sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      x: '<path d="M18 6 6 18M6 6l12 12"/>',
      heart: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
      share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/>',
      more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
      ban: '<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>',
      sparkles: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',
      arrowDown: '<path d="M12 5v14M19 12l-7 7-7-7"/>',
      globe: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
      trash: '<path d="M3 6h18M19 6l-1 14H6L5 6M9 6V4h6v2"/>',
      check: '<path d="M20 6 9 17l-5-5"/>',
      tag: '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1"/>',
      inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
      external: '<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'
    };
    function icon(name, cls = '') {
      return `<svg class="icon ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
    }
    function hydrateIcons(root = document) {
      root.querySelectorAll('i[data-icon]').forEach(el => {
        const wrap = document.createElement('span');
        wrap.innerHTML = icon(el.dataset.icon, el.className);
        const svg = wrap.firstElementChild;
        if (el.id) svg.id = el.id;
        el.replaceWith(svg);
      });
    }

    /* =========================================================
       設定値
       ========================================================= */
    // オートコンプリートの候補（収集中の話題に加えて表示。スポーツは含めていません）
    const TOPIC_DICTIONARY = [
      'ホロライブ', 'にじさんじ', 'VTuber', 'スマートホーム', 'Home Assistant', 'IoT', 'AIトレンド', '生成AI',
      'ChatGPT', 'Claude', 'Gemini', 'プログラミング', 'Webアプリ開発', 'Obsidian', 'ガジェット', 'iPhone', 'Android',
      'カメラ', 'ホームシアター', 'オーディオ', 'レトロゲーム', 'Nintendo Switch', 'PlayStation', 'アニメ', '映画', 'ドラマ',
      '漫画', '宇宙雑学', '天文', '科学', '量子コンピュータ', 'キャンプ', 'ガーデニング', '料理', 'レシピ',
      '旅行', '鉄道', '歴史', '経済', '副業', 'ネット販売', '物流', 'DIY', 'Starlink', 'ネットワーク', '自作PC', 'セキュリティ'
    ];
    const STORE_KEY = 'discover_app_state_v3';
    const DATA_URL = './articles.json';
    const FEED_LIMIT = 60;

    /* =========================================================
       状態の保存・読み込み
       ========================================================= */
    function defaults() {
      return {
        topics: null,          // null = 収集中の話題をすべてフォロー
        playfulness: 20,       // 意外な記事の割合（％）
        savedItems: {},        // 保存した記事（元の記事が消えても残るよう中身ごと保存）
        likedIds: [],
        dismissedIds: [],
        seenIds: [],           // 新着の判定用
        affinity: { topic: {}, source: {} }, // 反応から学習した好み
        theme: 'light',
        design: 'B',
        hintSeen: false
      };
    }
    function loadState() {
      const base = defaults();
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const st = { ...base, ...parsed };
          if (!parsed.design) st.theme = 'light'; // B案に切り替えた最初の1回だけ明るい配色にする
          return st;
        }
        const old = JSON.parse(localStorage.getItem('discover_app_state_v2') || 'null');
        if (old) return { ...base, topics: old.topics || null, theme: old.theme || 'dark', hintSeen: !!old.hintSeen };
      } catch (e) { /* 読めなくても初期値で動かす */ }
      return base;
    }
    function persist() {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* 保存できない環境でも動かす */ }
    }

    let state = loadState();
    let data = { updatedAt: null, topics: [], articles: [] };
    let feed = [];               // 現在のフィードに並べる記事IDの順番
    let activeChip = 'ALL';
    let loading = false;

    const $ = (sel) => document.querySelector(sel);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));
    const toHira = (s) => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
    const norm = (s) => toHira(String(s).normalize('NFKC').toLowerCase());
    const followed = () => state.topics ?? data.topics.map(t => t.name);
    const findArticle = (id) => data.articles.find(a => a.id === id) || state.savedItems[id];

    function fmtAgo(iso) {
      const t = Date.parse(iso);
      if (!Number.isFinite(t)) return '';
      const min = Math.floor((Date.now() - t) / 60000);
      if (min < 1) return 'たった今';
      if (min < 60) return `${min}分前`;
      if (min < 1440) return `${Math.floor(min / 60)}時間前`;
      return `${Math.floor(min / 1440)}日前`;
    }
    function fmtClock(iso) {
      const d = new Date(iso);
      return Number.isFinite(d.getTime()) ? `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : '';
    }

    /* =========================================================
       話題の判定と並び順（反応から学習）
       ========================================================= */
    // その記事が、フォロー中のどの話題に当たるか
    function matchedTopics(a) {
      const list = followed();
      const collected = new Map(data.topics.map(t => [t.name, t.keywords]));
      return list.filter(name => {
        if (a.topics?.includes(name)) return true;
        const words = [name, ...(collected.get(name) || [])];
        const title = norm(a.title);
        return words.some(w => title.includes(norm(w)));
      });
    }

    // 好みの記録：開いた・保存した・高評価 → プラス、興味なし → マイナス
    function learn(a, weight) {
      if (!a) return;
      const aff = state.affinity;
      const topics = matchedTopics(a);
      (topics.length ? topics : ['発見']).forEach(t => { aff.topic[t] = (aff.topic[t] || 0) + weight; });
      if (a.source) aff.source[a.source] = (aff.source[a.source] || 0) + weight;
      persist();
    }

    function score(a) {
      const hours = Math.max(0, (Date.now() - (Date.parse(a.published) || Date.now())) / 3600000);
      const fresh = Math.exp(-hours / 24);                       // 新しいほど高い
      const popular = Math.log1p(a.bookmarks || 0) / 8;          // はてブで話題なほど少し高い
      const topicAff = Math.max(0, ...matchedTopics(a).map(t => state.affinity.topic[t] || 0), 0);
      const srcAff = state.affinity.source[a.source] || 0;
      const image = a.image ? 0.05 : 0;
      return fresh + popular + Math.tanh(topicAff / 6) * 0.5 + Math.tanh(srcAff / 6) * 0.4 + image;
    }

    /* =========================================================
       フィードの組み立て
       ========================================================= */
    // 更新時だけ並びを決める（操作のたびに入れ替わらないように）
    function buildFeed() {
      const pool = data.articles.filter(a => !state.dismissedIds.includes(a.id));
      const main = pool.filter(a => matchedTopics(a).length).sort((x, y) => score(y) - score(x));
      const others = pool.filter(a => !matchedTopics(a).length)
        .map(a => ({ a, s: score(a) + Math.random() * 0.6 }))  // 意外性のため少しランダム
        .sort((x, y) => y.s - x.s).map(x => x.a);
      const p = Math.min(0.8, state.playfulness / 100);
      const mainCount = Math.min(main.length, Math.round(FEED_LIMIT * (1 - p)));
      const discoverCount = Math.min(others.length, p >= 0.999 ? FEED_LIMIT : Math.round(mainCount * p / (1 - p)) || (p > 0 ? 1 : 0));
      const picked = main.slice(0, mainCount).map(a => a.id);
      const extras = others.slice(0, discoverCount).map(a => a.id);
      // 意外な記事を均等に散らして混ぜる
      const step = extras.length ? Math.max(2, Math.floor(picked.length / extras.length)) : 0;
      extras.forEach((id, i) => picked.splice(Math.min(picked.length, (i + 1) * step + i), 0, id));
      feed = picked;
    }

    function visibleArticles() {
      return feed.map(id => data.articles.find(a => a.id === id)).filter(a => a && !state.dismissedIds.includes(a.id)).filter(a => {
        const topics = matchedTopics(a);
        if (activeChip === 'REC') return topics.length === 0;
        if (activeChip !== 'ALL') return topics.includes(activeChip);
        return true;
      });
    }

    function cardHTML(a, i) {
      const saved = !!state.savedItems[a.id];
      const liked = state.likedIds.includes(a.id);
      const topics = matchedTopics(a);
      const label = topics.length ? esc(topics[0]) : `<span class="rec-l">🎲 ${esc(a.feed || '発見')}</span>`;
      const letter = esc((a.source || '?').slice(0, 1).toUpperCase());
      const link = (inner) => `<a href="${esc(a.url)}" target="_blank" rel="noopener" data-act="open" draggable="false">${inner}</a>`;
      const thumb = `<a class="thumb ${a.image ? '' : 'noimg'}" href="${esc(a.url)}" target="_blank" rel="noopener" data-act="open" draggable="false">
          ${a.image ? `<img src="${esc(a.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.classList.add('noimg');this.remove()">` : ''}
          <span class="ph">${letter}</span>${a.via === 'youtube' ? '<span class="play" aria-label="動画">▶</span>' : ''}</a>`;
      const src = `<div class="src"><span class="fav ${a.via === 'youtube' ? 'yt' : ''}">${a.via === 'youtube' ? '▶' : letter}</span>${esc(a.source)}${a.via === 'youtube' ? ' · YouTube' : ''}</div>`;
      const sub = `<div class="sub"><span>${esc(fmtAgo(a.published))} · ${label}${a.bookmarks ? ` · ${a.bookmarks} users` : ''}</span>
          ${liked ? icon('heart', 'sm fill liked-i') : ''}${saved ? icon('bookmark', 'sm fill saved-i') : ''}
          <button class="more" data-act="more" aria-label="メニュー">${icon('more', 'sm')}</button></div>`;
      const body = i === 0
        ? `<article class="card hero">${thumb}${src}<h2>${link(esc(a.title))}</h2>${sub}</article>`
        : `<article class="card row"><div class="txt">${src}<h3>${link(esc(a.title))}</h3>${sub}</div>${thumb}</article>`;
      return `
        <div class="swipe" data-id="${esc(a.id)}">
          <div class="swipe-bg">
            <div class="bg-save">${icon('bookmark')}${saved ? '保存解除' : '保存'}</div>
            <div class="bg-dismiss">興味なし${icon('ban')}</div>
          </div>
          ${body}
        </div>`;
    }

    function render() {
      const list = visibleArticles();
      $('#feed-stat').textContent = `${list.length}件`;
      $('#empty').hidden = list.length > 0;
      $('#feed').innerHTML = list.map(cardHTML).join('');
      renderChips();
      renderSavedBadge();
      $('#updated').textContent = data.updatedAt ? `最終収集 ${fmtClock(data.updatedAt)}` : '記事を読み込み中…';
    }

    // スケルトンスクリーン（読み込み中の仮表示）
    function renderSkeleton(n = 3) {
      $('#empty').hidden = true;
      $('#feed-stat').textContent = '読み込み中…';
      $('#feed').innerHTML = `
        <div class="skel hero" aria-hidden="true"><div class="sk img"></div>
          <div class="sk line" style="width:35%"></div><div class="sk line" style="width:95%;height:16px"></div><div class="sk line" style="width:70%;height:16px"></div></div>` +
        Array.from({ length: n + 2 }, () => `
        <div class="skel list" aria-hidden="true"><div class="grow">
          <div class="sk line" style="width:40%"></div><div class="sk line" style="width:95%;height:14px"></div>
          <div class="sk line" style="width:80%;height:14px"></div><div class="sk line" style="width:30%"></div></div>
          <div class="sk box"></div></div>`).join('');
    }

    function renderChips() {
      const chips = [['ALL', '✨ すべて'], ...followed().map(t => [t, t]), ['REC', '🎲 発見']];
      if (!chips.some(([v]) => v === activeChip)) activeChip = 'ALL';
      $('#chips').innerHTML = chips.map(([v, label]) =>
        `<button class="chip ${v === activeChip ? 'active' : ''}" data-chip="${esc(v)}">${esc(label)}</button>`).join('');
    }

    function renderSavedBadge() {
      const n = Object.keys(state.savedItems).length;
      const b = $('#saved-badge');
      b.hidden = n === 0;
      b.textContent = n;
    }

    /* =========================================================
       記事の読み込み（プルトゥリフレッシュ・更新ボタン共通）
       ========================================================= */
    async function loadArticles() {
      const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    async function refresh(showMessage = true) {
      if (loading) return;
      loading = true;
      $('#refresh-btn svg').classList.add('spin');
      const hadData = data.articles.length > 0;
      renderSkeleton();
      const started = Date.now();
      try {
        const json = await loadArticles();
        await sleep(Math.max(0, 500 - (Date.now() - started))); // スケルトンが一瞬で消えないように
        const seen = new Set(state.seenIds);
        const fresh = json.articles.filter(a => !seen.has(a.id)).length;
        data = json;
        state.seenIds = json.articles.map(a => a.id);
        state.dismissedIds = state.dismissedIds.slice(-1000);
        persist();
        buildFeed();
        render();
        if (showMessage) toast(hadData ? (fresh ? `新着 ${fresh}件を読み込みました` : '新しい記事はまだありません') : '記事を読み込みました');
      } catch (e) {
        render();
        toast('記事を読み込めませんでした。通信状態を確認してください', '再試行', () => refresh(true));
      } finally {
        $('#refresh-btn svg').classList.remove('spin');
        loading = false;
      }
    }

    /* =========================================================
       記事への操作
       ========================================================= */
    function snapshot(a) {
      return { id: a.id, title: a.title, url: a.url, source: a.source, image: a.image, published: a.published, topics: a.topics, feed: a.feed };
    }

    function toggleSave(id) {
      const a = findArticle(id);
      if (!a) return;
      const was = !!state.savedItems[id];
      const apply = (on) => {
        if (on) state.savedItems[id] = snapshot(a); else delete state.savedItems[id];
        persist(); render(); renderSavedList();
      };
      apply(!was);
      if (!was) learn(a, 2);
      toast(was ? '保存を解除しました' : 'あとで読むに保存しました', '元に戻す', () => apply(was));
    }

    function toggleLike(id) {
      const a = findArticle(id);
      const was = state.likedIds.includes(id);
      state.likedIds = was ? state.likedIds.filter(x => x !== id) : [...state.likedIds, id].slice(-1000);
      learn(a, was ? -2 : 2);
      persist(); render();
      toast(was ? '高評価を取り消しました' : '高評価しました。似た記事が上に来やすくなります');
    }

    function dismiss(id) {
      const a = findArticle(id);
      if (!state.dismissedIds.includes(id)) state.dismissedIds.push(id);
      learn(a, -2);
      persist(); render();
      toast('「興味なし」にしました', '元に戻す', () => {
        state.dismissedIds = state.dismissedIds.filter(x => x !== id);
        learn(a, 2);
        persist(); render();
      });
    }

    // カードを畳むアニメーションのあとに非表示にする
    function animateDismiss(wrap, id) {
      wrap.style.height = wrap.offsetHeight + 'px';
      wrap.classList.add('collapse');
      requestAnimationFrame(() => {
        wrap.style.height = '0px';
        wrap.style.opacity = '0';
        wrap.style.marginBottom = '-14px';
      });
      setTimeout(() => dismiss(id), 260);
    }

    async function shareArticle(id) {
      const a = findArticle(id);
      if (!a) return;
      if (navigator.share) {
        try { await navigator.share({ title: a.title, url: a.url }); } catch (e) { /* キャンセル */ }
      } else if (navigator.clipboard) {
        try { await navigator.clipboard.writeText(`${a.title}\n${a.url}`); toast('タイトルとURLをコピーしました'); } catch (e) { toast('コピーできませんでした'); }
      }
    }

    function openArticle(id) {
      learn(findArticle(id), 1); // 開いた記事を好みとして記録
    }

    /* =========================================================
       話題（トピック）のフォロー
       ========================================================= */
    function setTopics(list) {
      state.topics = list;
      persist();
      buildFeed(); render(); renderTopics();
    }

    function addTopic(name) {
      const t = name.trim();
      if (!t) return;
      const list = followed();
      if (list.includes(t)) { toast(`「${t}」はフォロー済みです`); return; }
      setTopics([...list, t]);
      const collected = data.topics.some(x => x.name === t);
      toast(collected ? `「${t}」をフォローしました` : `「${t}」をフォロー（タイトルに含む記事を表示）`, '取り消す', () => setTopics(followed().filter(x => x !== t)));
    }

    function removeTopic(t) {
      const before = followed();
      setTopics(before.filter(x => x !== t));
      toast(`「${t}」のフォローを解除しました`, '元に戻す', () => setTopics(before));
    }

    function renderTopics() {
      const list = followed();
      $('#topic-count').textContent = `${list.length}件`;
      $('#topic-tags').innerHTML = list.map(t =>
        `<span class="tag-pill">${esc(t)}<button data-remove="${esc(t)}" aria-label="${esc(t)}のフォローを解除">${icon('x', 'sm')}</button></span>`).join('')
        || '<span class="muted">まだありません</span>';
      const collected = data.topics.map(t => t.name);
      $('#presets').innerHTML = collected.length
        ? collected.map(p => `<button class="preset" data-preset="${esc(p)}" ${list.includes(p) ? 'disabled' : ''}>${list.includes(p) ? '✓' : '+'} ${esc(p)}</button>`).join('')
        : '<span class="muted">記事の読み込み後に表示されます</span>';
    }

    /* =========================================================
       オートコンプリート
       ========================================================= */
    function attachAutocomplete(input, listEl, onPick) {
      let items = [];
      let index = -1;

      function highlight(text, q) {
        const n = norm(text), i = n.indexOf(norm(q));
        if (i < 0 || n.length !== text.length) return esc(text);
        return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
      }

      function update() {
        const q = input.value.trim();
        if (!q) { hide(); return; }
        const nq = norm(q);
        const collected = data.topics.map(t => t.name);
        const candidates = [...new Set([...collected, ...TOPIC_DICTIONARY])];
        const matched = candidates
          .map(t => ({ t, i: norm(t).indexOf(nq) }))
          .filter(x => x.i >= 0)
          .sort((a, b) => (a.i === 0 ? 0 : 1) - (b.i === 0 ? 0 : 1) || a.t.length - b.t.length)
          .slice(0, 6)
          .map(x => ({ value: x.t, followed: followed().includes(x.t), collected: collected.includes(x.t) }));
        if (!matched.some(m => norm(m.value) === nq)) matched.push({ value: q, isNew: true });
        items = matched;
        index = -1;
        listEl.innerHTML = items.map((it, i) => `
          <li class="ac-item" role="option" data-i="${i}">
            ${icon(it.isNew ? 'plus' : 'tag', 'sm')}
            <span>${it.isNew ? `「${esc(it.value)}」を新しくフォロー` : highlight(it.value, q)}</span>
            ${it.followed ? '<span class="tag">フォロー中</span>' : it.collected ? '<span class="tag">収集中</span>' : ''}
          </li>`).join('');
        listEl.hidden = false;
      }

      function hide() { listEl.hidden = true; items = []; index = -1; }
      function setActive(i) {
        index = i;
        listEl.querySelectorAll('.ac-item').forEach((el, k) => el.classList.toggle('active', k === i));
        listEl.querySelector('.ac-item.active')?.scrollIntoView({ block: 'nearest' });
      }
      function pick(i) {
        const it = items[i];
        if (!it) return;
        onPick(it.value);
        input.value = '';
        hide();
      }

      input.addEventListener('input', update);
      input.addEventListener('focus', update);
      input.addEventListener('blur', () => setTimeout(hide, 120));
      input.addEventListener('keydown', (e) => {
        if (e.isComposing || e.keyCode === 229) return; // 日本語の変換確定中のEnterは無視
        if (listEl.hidden) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(items.length - 1, index + 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(0, index - 1)); }
        else if (e.key === 'Enter') { e.preventDefault(); pick(index >= 0 ? index : 0); input.blur(); }
        else if (e.key === 'Escape') { hide(); }
      });
      // タップ時に入力欄のフォーカスが外れないよう pointerdown で確定する
      listEl.addEventListener('pointerdown', (e) => {
        const li = e.target.closest('.ac-item');
        if (!li) return;
        e.preventDefault();
        pick(Number(li.dataset.i));
      });
    }

    /* =========================================================
       トースト（「元に戻す」ボタン付き）
       ========================================================= */
    let toastTimer;
    function toast(msg, actionLabel, onAction) {
      const t = $('#toast'), btn = $('#toast-action');
      $('#toast-msg').textContent = msg;
      if (actionLabel) {
        btn.hidden = false;
        btn.textContent = actionLabel;
        btn.onclick = () => { hideToast(); onAction(); };
      } else {
        btn.hidden = true;
        btn.onclick = null;
      }
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, actionLabel ? 5000 : 2800);
    }
    function hideToast() { $('#toast').classList.remove('show'); }

    /* =========================================================
       ボトムシート
       ========================================================= */
    let currentSheet = null;
    function openSheet(id) {
      if (currentSheet) currentSheet.classList.remove('open');
      currentSheet = document.getElementById(id);
      currentSheet.classList.add('open');
      $('#backdrop').classList.add('show');
      document.body.classList.add('lock');
    }
    function closeSheet() {
      if (!currentSheet) return;
      currentSheet.classList.remove('open');
      currentSheet = null;
      $('#backdrop').classList.remove('show');
      document.body.classList.remove('lock');
    }

    // つまみ部分を下にドラッグして閉じる
    function setupSheetDrag() {
      document.querySelectorAll('.sheet-head').forEach(head => {
        let drag = null;
        head.addEventListener('pointerdown', (e) => {
          if (e.target.closest('button')) return;
          const sheet = head.closest('.sheet');
          drag = { sheet, y0: e.clientY, t0: performance.now(), dy: 0 };
          head.setPointerCapture(e.pointerId);
          sheet.classList.add('dragging');
        });
        head.addEventListener('pointermove', (e) => {
          if (!drag) return;
          drag.dy = Math.max(0, e.clientY - drag.y0);
          drag.sheet.style.transform = `translateY(${drag.dy}px)`;
          $('#backdrop').style.opacity = String(1 - Math.min(1, drag.dy / drag.sheet.offsetHeight));
        });
        const end = () => {
          if (!drag) return;
          const { sheet, dy, t0 } = drag;
          drag = null;
          sheet.classList.remove('dragging');
          sheet.style.transform = '';
          $('#backdrop').style.opacity = '';
          const speed = dy / (performance.now() - t0);
          if (dy > 110 || (speed > 0.6 && dy > 24)) closeSheet();
        };
        head.addEventListener('pointerup', end);
        head.addEventListener('pointercancel', end);
      });
    }

    function renderSavedList() {
      const saved = Object.values(state.savedItems).reverse();
      $('#saved-list').innerHTML = saved.length
        ? saved.map(a => `<div class="saved-item">
            <a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}<small>${esc(a.source)}</small></a>
            <button class="icon-btn" data-unsave="${esc(a.id)}" aria-label="保存を解除">${icon('trash', 'sm')}</button></div>`).join('')
        : '<p class="muted" style="padding:16px 0">保存した記事はまだありません。カードを右にスワイプすると保存できます。</p>';
    }

    function openActions(id) {
      const a = findArticle(id);
      if (!a) return;
      const saved = !!state.savedItems[id];
      const topic = matchedTopics(a)[0];
      $('#actions-title').textContent = a.title;
      $('#actions-list').innerHTML = `
        <button data-do="open">${icon('external')}記事を開く</button>
        <button data-do="like">${icon('heart', state.likedIds.includes(id) ? 'fill' : '')}${state.likedIds.includes(id) ? '高評価を取り消す' : '高評価（似た記事を増やす）'}</button>
        <button data-do="save">${icon('bookmark', saved ? 'fill' : '')}${saved ? '保存を解除' : 'あとで読むに保存'}</button>
        <button data-do="share">${icon('share')}共有</button>
        ${topic ? `<button data-do="unfollow">${icon('check')}「${esc(topic)}」のフォローを解除</button>` : ''}
        <button data-do="dismiss" class="danger">${icon('ban')}興味なし</button>`;
      $('#actions-list').dataset.id = id;
      $('#actions-list').dataset.topic = topic || '';
      openSheet('sheet-actions');
    }

    /* =========================================================
       スワイプ操作 & 長押し（カード）
       ========================================================= */
    let swipe = null;
    let longPressTimer = null;
    let suppressClickUntil = 0;
    const threshold = (card) => Math.min(110, card.offsetWidth * 0.3);

    function setupSwipe() {
      const feedEl = $('#feed');

      feedEl.addEventListener('pointerdown', (e) => {
        const card = e.target.closest('.card');
        if (!card || e.button > 0 || loading) return;
        const wrap = card.parentElement;
        swipe = { card, wrap, id: wrap.dataset.id, x0: e.clientX, y0: e.clientY, dx: 0, mode: null, pid: e.pointerId, armed: false };
        clearTimeout(longPressTimer);
        longPressTimer = setTimeout(() => {
          if (swipe && !swipe.mode) {
            swipe.mode = 'longpress';
            navigator.vibrate?.(10);
            openActions(swipe.id);
          }
        }, 550);
      });

      window.addEventListener('pointermove', (e) => {
        if (!swipe || e.pointerId !== swipe.pid) return;
        const dx = e.clientX - swipe.x0, dy = e.clientY - swipe.y0;
        if (!swipe.mode && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
          clearTimeout(longPressTimer);
          if (Math.abs(dx) > Math.abs(dy) * 1.2) {
            swipe.mode = 'h';
            swipe.card.classList.add('dragging');
            try { swipe.card.setPointerCapture(e.pointerId); } catch (err) {}
          } else {
            swipe.mode = 'v';
          }
        }
        if (swipe.mode !== 'h') return;
        swipe.dx = dx;
        swipe.card.style.transform = `translateX(${dx}px)`;
        swipe.wrap.dataset.dir = dx > 0 ? 'right' : 'left';
        const armed = Math.abs(dx) > threshold(swipe.card);
        if (armed !== swipe.armed) {
          swipe.armed = armed;
          swipe.wrap.classList.toggle('armed', armed);
          if (armed) navigator.vibrate?.(8);
        }
      });

      const end = () => {
        clearTimeout(longPressTimer);
        if (!swipe) return;
        const s = swipe;
        swipe = null;
        if (s.mode === 'longpress') { suppressClickUntil = Date.now() + 500; return; }
        if (s.mode !== 'h') return;
        suppressClickUntil = Date.now() + 400;
        s.card.classList.remove('dragging');
        const w = s.card.offsetWidth;
        if (s.dx < -threshold(s.card)) {
          // 左スワイプ：画面外へ飛ばして「興味なし」
          s.card.style.transform = `translateX(${-w * 1.2}px)`;
          setTimeout(() => animateDismiss(s.wrap, s.id), 180);
        } else {
          s.card.style.transform = '';
          s.wrap.classList.remove('armed');
          setTimeout(() => { delete s.wrap.dataset.dir; }, 250);
          if (s.dx > threshold(s.card)) setTimeout(() => toggleSave(s.id), 200); // 右スワイプ：保存
        }
      };
      window.addEventListener('pointerup', end);
      window.addEventListener('pointercancel', end);

      // ボタンや記事リンクのタップ（スワイプ・長押し直後のタップは無視）
      feedEl.addEventListener('click', (e) => {
        if (Date.now() < suppressClickUntil) { e.preventDefault(); e.stopPropagation(); return; }
        const el = e.target.closest('[data-act]');
        if (!el) return;
        const id = el.closest('.swipe').dataset.id;
        ({ like: toggleLike, save: toggleSave, share: shareArticle, more: openActions, open: openArticle })[el.dataset.act]?.(id);
      });
      // iPhoneでリンク長押しのプレビューを出さない
      feedEl.addEventListener('contextmenu', (e) => { if (e.target.closest('.card')) e.preventDefault(); });
    }

    /* =========================================================
       プルトゥリフレッシュ（引っぱって更新）
       ========================================================= */
    function setupPullToRefresh() {
      const mainEl = $('#main'), ptr = $('#ptr'), text = $('#ptr-text');
      const TRIGGER = 70;
      let p = null;

      function setPull(d) {
        mainEl.style.setProperty('--pull', d + 'px');
        ptr.style.setProperty('--ptr-o', Math.min(1, d / 40));
        ptr.style.setProperty('--ptr-rot', d >= TRIGGER ? '180deg' : '0deg');
      }

      document.addEventListener('touchstart', (e) => {
        if (currentSheet || loading || window.scrollY > 0 || e.touches.length > 1) return;
        p = { y0: e.touches[0].clientY, x0: e.touches[0].clientX, dist: 0, decided: false };
        mainEl.classList.remove('release');
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!p) return;
        const dy = e.touches[0].clientY - p.y0, dx = e.touches[0].clientX - p.x0;
        if (!p.decided) {
          if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
          if (Math.abs(dx) > Math.abs(dy) || dy < 0) { p = null; return; } // 横移動・上方向は対象外
          p.decided = true;
        }
        if (swipe && swipe.mode === 'h') { p = null; setPull(0); return; }
        e.preventDefault();
        p.dist = Math.min(120, Math.max(0, dy) * 0.5);
        setPull(p.dist);
        text.textContent = p.dist >= TRIGGER ? '離して更新' : '引っぱって更新';
      }, { passive: false });

      document.addEventListener('touchend', async () => {
        if (!p) return;
        const go = p.dist >= TRIGGER;
        p = null;
        mainEl.classList.add('release');
        if (!go) { setPull(0); return; }
        setPull(56);
        ptr.classList.add('loading');
        text.textContent = '更新中…';
        await refresh(true);
        ptr.classList.remove('loading');
        setPull(0);
      });
    }

    /* =========================================================
       テーマ・その他
       ========================================================= */
    function applyTheme() {
      document.documentElement.dataset.theme = state.theme;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', state.theme === 'dark' ? '#1b1c1e' : '#ffffff');
      const old = $('#theme-icon');
      const wrap = document.createElement('span');
      wrap.innerHTML = icon(state.theme === 'dark' ? 'sun' : 'moon');
      wrap.firstElementChild.id = 'theme-icon';
      old.replaceWith(wrap.firstElementChild);
    }

    function updatePlayLabel() {
      const v = state.playfulness;
      $('#play-val').textContent = v < 15 ? `${v}%（堅実）` : v > 50 ? `${v}%（冒険）` : `${v}%`;
    }

    function setupEvents() {
      $('#refresh-btn').addEventListener('click', () => refresh(true));
      $('#settings-btn').addEventListener('click', () => openSheet('sheet-settings'));
      $('#empty-settings').addEventListener('click', () => openSheet('sheet-settings'));
      $('#saved-btn').addEventListener('click', () => { renderSavedList(); openSheet('sheet-saved'); });
      $('#theme-btn').addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        persist(); applyTheme();
      });
      $('#backdrop').addEventListener('click', closeSheet);
      document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

      $('#hint-close').addEventListener('click', () => { state.hintSeen = true; persist(); $('#hint').hidden = true; });

      $('#chips').addEventListener('click', (e) => {
        const c = e.target.closest('[data-chip]');
        if (!c) return;
        activeChip = c.dataset.chip;
        render();
        window.scrollTo({ top: 0 });
      });

      const slider = $('#play-slider');
      slider.addEventListener('input', () => { state.playfulness = Number(slider.value); updatePlayLabel(); });
      slider.addEventListener('change', () => { persist(); buildFeed(); render(); toast(`意外な記事の割合を ${state.playfulness}% にしました`); });

      $('#topic-tags').addEventListener('click', (e) => {
        const b = e.target.closest('[data-remove]');
        if (b) removeTopic(b.dataset.remove);
      });
      $('#presets').addEventListener('click', (e) => {
        const b = e.target.closest('[data-preset]');
        if (b && !b.disabled) addTopic(b.dataset.preset);
      });
      $('#saved-list').addEventListener('click', (e) => {
        const b = e.target.closest('[data-unsave]');
        if (b) toggleSave(b.dataset.unsave);
      });
      $('#actions-list').addEventListener('click', (e) => {
        const b = e.target.closest('[data-do]');
        if (!b) return;
        const { id, topic } = $('#actions-list').dataset;
        const a = findArticle(id);
        closeSheet();
        if (b.dataset.do === 'open' && a) { openArticle(id); window.open(a.url, '_blank', 'noopener'); }
        if (b.dataset.do === 'like') toggleLike(id);
        if (b.dataset.do === 'save') toggleSave(id);
        if (b.dataset.do === 'share') shareArticle(id);
        if (b.dataset.do === 'unfollow' && topic) removeTopic(topic);
        if (b.dataset.do === 'dismiss') {
          const wrap = document.querySelector(`.swipe[data-id="${CSS.escape(id)}"]`);
          wrap ? animateDismiss(wrap, id) : dismiss(id);
        }
      });
      $('#reset-btn').addEventListener('click', () => {
        const keep = { theme: state.theme, savedItems: state.savedItems, hintSeen: true };
        state = { ...defaults(), ...keep };
        persist(); closeSheet(); applyTheme(); updatePlayLabel();
        $('#play-slider').value = state.playfulness;
        buildFeed(); render(); renderTopics();
        toast('学習内容と設定を初期化しました（保存した記事は残しています）');
      });

      attachAutocomplete($('#quick-input'), $('#quick-ac'), addTopic);
      attachAutocomplete($('#topic-input'), $('#topic-ac'), addTopic);
    }

    /* =========================================================
       起動
       ========================================================= */
    async function init() {
      hydrateIcons();
      applyTheme();
      $('#play-slider').value = state.playfulness;
      updatePlayLabel();
      $('#hint').hidden = state.hintSeen;
      setupEvents();
      setupSheetDrag();
      setupSwipe();
      setupPullToRefresh();
      renderTopics();
      await refresh(false);
      renderTopics();
    }
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
